server:
  # o Render informa a porta pela variável PORT
  port: ${PORT:8080}

spring:
  application:
    name: bovix-api
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    # Produção: defina SPRING_DATASOURCE_URL (jdbc:postgresql://<host>/<banco>?sslmode=require),
    # SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD. A URL do Neon no formato
    # postgresql://usuario:senha@host/banco também é aceita (ou via DATABASE_URL) e convertida por
    # DatabaseUrlEnvironmentPostProcessor.
    # Os valores padrão abaixo são só os do Postgres LOCAL do docker-compose (porta 5433, para não
    # conflitar com um PostgreSQL nativo) — não são credenciais de nenhum ambiente real.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/bovix}
    username: ${SPRING_DATASOURCE_USERNAME:bovix}
    password: ${SPRING_DATASOURCE_PASSWORD:bovix}
    hikari:
      # Neon (plano grátis) desliga o banco depois de 5 min sem uso e cobra pelas horas ligado.
      # Sem conexões ociosas presas no pool, o banco pode "dormir" quando ninguém usa o sistema.
      minimum-idle: 0
      maximum-pool-size: 5
      idle-timeout: 120000
  jpa:
    hibernate:
      ddl-auto: validate   # o schema é criado pelo Flyway, nunca pelo Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # o frontend já reduz a foto antes de enviar (~300 KB); o servidor aceita até 3 MB por foto
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${BOVIX_SMTP_HOST:smtp.gmail.com}
    port: ${BOVIX_SMTP_PORT:587}
    username: ${BOVIX_SMTP_USER:}
    password: ${BOVIX_SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

bovix:
  # só para fotos antigas, enviadas antes da V7: as novas ficam no banco (tabela animal_fotos)
  uploads-dir: uploads/animais
  # endereço público do frontend, usado no link de "esqueci minha senha"
  frontend-url: ${BOVIX_FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${BOVIX_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # fuso usado para "hoje" (alertas, confirmação de cio, horário do e-mail) — o servidor roda em UTC
  fuso-horario: ${BOVIX_FUSO_HORARIO:America/Sao_Paulo}
  notificacao:
    # e-mail que aparece como remetente do relatório diário
    remetente: ${BOVIX_SMTP_USER:bovix@example.com}
    # intervalo (minutos) em que o sistema confere se é hora de mandar o relatório de alguma fazenda
    intervalo-verificacao-minutos: 10
  jwt:
    # ATENÇÃO: gere um segredo forte e único em produção (ex: openssl rand -base64 64)
    # e defina via variável de ambiente BOVIX_JWT_SECRET. Sem ela (ou com menos de 32 bytes) a API não sobe.
    secret: ${BOVIX_JWT_SECRET:}
    expiration-ms: 604800000   # 7 dias
